databases:
  - name: hejrmarket-demo-db
    databaseName: hejrmarket_demo
    user: hejrmarket
    plan: free
    region: frankfurt

services:
  - type: web
    name: hejrmarket-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py load_store_snapshot --replace && gunicorn ecomprj.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: DJANGO_DEMO_SERVE_MEDIA
        value: "True"
      - key: DJANGO_STRICT_STATIC_MANIFEST
        value: "False"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: ZARINPAL_SANDBOX
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: hejrmarket-demo-db
          property: connectionString
