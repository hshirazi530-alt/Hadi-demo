{% extends 'admin/base.html' %}
{% load static %}

{% block page_content %}
    <div id="hjm-admin-loader" role="status" aria-live="polite" aria-atomic="true" aria-label="در حال بارگذاری پنل مدیریت">
        <div class="hjm-admin-loader__content">
            <span class="hjm-admin-loader__mark" aria-hidden="true">
                <img src="{% static 'assets/imgs/theme/hejrmarket-logo.png' %}" alt="" width="768" height="768" fetchpriority="high" decoding="async">
            </span>
            <p class="hjm-admin-loader__brand">هژیر مارکت</p>
            <p class="hjm-admin-loader__message">در حال بارگذاری پنل مدیریت</p>
            <span class="hjm-admin-loader__progress" aria-hidden="true"></span>
        </div>
    </div>
    <noscript><style>#hjm-admin-loader { display: none !important; }</style></noscript>
    {{ block.super }}
{% endblock %}
