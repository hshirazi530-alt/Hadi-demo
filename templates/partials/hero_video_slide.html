{% load static %}
<article class="swiper-slide hm-hero__slide hm-hero-video" data-hero-video-slide data-swiper-autoplay="11000" aria-label="ویدئوی معرفی محصول">
    <div class="hm-hero-video__frame">
        <video class="hm-hero-video__video" data-hero-video muted playsinline loop preload="metadata" poster="{% static 'assets/video/hero-feature-1-poster.webp' %}" aria-label="ویدئوی معرفی محصول">
            <source src="{% static 'assets/video/hero-feature-1.mp4' %}" type="video/mp4">
            مرورگر شما امکان پخش ویدئو را ندارد.
        </video>
        <div class="hm-hero-video__copy" dir="rtl">
            <p class="hm-hero-video__eyebrow">انتخابی برای آراستگی</p>
            <h2 class="hm-hero-video__title">آراستگی،<br><span>در هر لحظه</span></h2>
            <p class="hm-hero-video__description">ابزارهای اصلاح و مراقبت شخصی را متناسب با سبک خود انتخاب کنید.</p>
            <div class="hm-hero-video__actions hm-hero__actions">
                <a class="hm-hero__cta" href="{% url 'core:product-list' %}">دیدن محصولات</a>
                <a class="hm-hero__cta hm-hero__cta--quiet" href="{% url 'core:category-list' %}">همهٔ دسته‌بندی‌ها</a>
            </div>
        </div>
        <div class="hm-hero-video__controls" aria-label="کنترل ویدئو">
            <button type="button" data-video-play aria-label="توقف ویدئو">توقف ویدئو</button>
        </div>
    </div>
</article>
