<article class="swiper-slide hm-amazing-card hm-offer-inquiry">
    <a class="hm-amazing-card__image" href="{% url 'core:catalog-inquiry-detail' item.id %}" aria-label="اطلاعات در حال بررسی برای {{ item.title }}">{% include 'partials/catalog-inquiry-image.html' %}</a>
    <div class="hm-amazing-card__body">
        <small>{{ item.category_label }} · در حال بررسی</small>
        <h3><a href="{% url 'core:catalog-inquiry-detail' item.id %}">{{ item.title }}</a></h3>
        {% if item.note %}<small class="hm-offer-note">{{ item.note }}</small>{% endif %}
        <p class="hm-inquiry-status">قیمت و موجودی در انتظار تأیید</p>
        <a class="hm-inquiry-cta" href="{% url 'core:catalog-inquiry-detail' item.id %}">اطلاعات و استعلام ←</a>
    </div>
</article>
